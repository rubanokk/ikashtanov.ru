{% extends 'base.html' %}

{% block title %}Психолог Илья Каштанов{% endblock %}

{% block content %}
{% if posts %}
    <ul>
    {% for post in posts %}
        <li><a href="/blog/{{ post.id }}/">{{ post.title }}</a></li>
    {% endfor %}
    </ul>
{% else %}
    <p>No polls are available.</p>
{% endif %}

<br>
<br>
<a href="/blog">Читать весь блог</a>
{% endblock %}
